name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

  desktop-windows:
    name: Desktop Windows package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck desktop
        run: npm run desktop:typecheck

      - name: Build Windows installer
        run: npm run desktop:make

      - name: Verify Windows installer
        run: >-
          node scripts/verify-desktop-package.mjs
          --setup "out-desktop/make/squirrel.windows/x64/ChatCOM-Desktop-1.0.0-rc.4-Setup.exe"
          --app "out-desktop/ChatCOM-win32-x64"
          --manifest "out-desktop/desktop-build-manifest.json"
          --sums "out-desktop/SHA256SUMS.txt"

      - name: Upload Windows installer
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: chatcom-desktop-1.0.0-rc.4-windows-x64-local-validation
          path: |
            out-desktop/make/squirrel.windows/x64/ChatCOM-Desktop-1.0.0-rc.4-Setup.exe
            out-desktop/make/squirrel.windows/x64/*-full.nupkg
            out-desktop/make/squirrel.windows/x64/RELEASES
            out-desktop/SHA256SUMS.txt
            out-desktop/desktop-build-manifest.json
          if-no-files-found: error
          retention-days: 14
