name: Sign Windows RC

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SIGN_RC4 to authorize one protected signing request
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: chatcom-windows-code-signing
  cancel-in-progress: false

jobs:
  sign-windows:
    name: Sign and verify Windows RC.4 with SignPath
    runs-on: windows-2025
    environment: windows-code-signing
    steps:
      - name: Validate protected SignPath context
        shell: pwsh
        env:
          CHATCOM_CONFIRMATION: ${{ inputs.confirmation }}
          CHATCOM_REF: ${{ github.ref }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_PUBLISHER_SUBJECT: ${{ vars.SIGNPATH_PUBLISHER_SUBJECT }}
        run: |
          if ($env:CHATCOM_CONFIRMATION -cne "SIGN_RC4") { throw "SIGNING_CONFIRMATION_INVALID" }
          if ($env:CHATCOM_REF -cne "refs/heads/main") { throw "SIGNING_REF_INVALID" }
          $required = @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG",
            "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG",
            "SIGNPATH_PUBLISHER_SUBJECT"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "SIGNING_CONFIGURATION_INCOMPLETE"
            }
          }
          "CHATCOM_SIGNING_PREFLIGHT kind=READY provider=SIGNPATH configuration=COMPLETE"

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Verify checked-out origin and commit
        shell: pwsh
        run: |
          $origin = git remote get-url origin
          if ($origin -cne "https://github.com/NoisyBoyFR/ChatCOM.git") { throw "SIGNING_ORIGIN_INVALID" }
          if ((git rev-parse --abbrev-ref HEAD) -cne "main") { throw "SIGNING_BRANCH_INVALID" }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Build unsigned desktop package for SignPath
        run: npm run desktop:make

      - name: Upload protected signing input
        id: upload-signing-input
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: chatcom-desktop-1.0.0-rc.4-windows-x64-signpath-input
          path: out-desktop
          if-no-files-found: error
          retention-days: 7

      - name: Submit one SignPath signing request
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-signing-input.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: out-desktop-signed

      - name: Verify signed PE files independently
        shell: pwsh
        env:
          SIGNPATH_PUBLISHER_SUBJECT: ${{ vars.SIGNPATH_PUBLISHER_SUBJECT }}
        run: |
          $setup = Join-Path $PWD "out-desktop-signed\make\squirrel.windows\x64\ChatCOM-Desktop-1.0.0-rc.4-Setup.exe"
          $app = Join-Path $PWD "out-desktop-signed\ChatCOM-win32-x64\ChatCOM.exe"
          if (!(Test-Path -LiteralPath $setup) -or !(Test-Path -LiteralPath $app)) { throw "SIGNED_PACKAGE_LAYOUT_INVALID" }
          .\scripts\verify-windows-signature.ps1 -Path $app -ExpectedSubject $env:SIGNPATH_PUBLISHER_SUBJECT -RequireTimestamp
          .\scripts\verify-windows-signature.ps1 -Path $setup -ExpectedSubject $env:SIGNPATH_PUBLISHER_SUBJECT -RequireTimestamp

      - name: Verify signed package and emit final hashes
        shell: pwsh
        env:
          SIGNPATH_PUBLISHER_SUBJECT: ${{ vars.SIGNPATH_PUBLISHER_SUBJECT }}
        run: |
          node scripts/verify-desktop-package.mjs `
            --setup "out-desktop-signed/make/squirrel.windows/x64/ChatCOM-Desktop-1.0.0-rc.4-Setup.exe" `
            --app "out-desktop-signed/ChatCOM-win32-x64" `
            --manifest "out-desktop-signed/desktop-build-manifest.json" `
            --sums "out-desktop-signed/SHA256SUMS.txt" `
            --expect-signed `
            --publisher-subject $env:SIGNPATH_PUBLISHER_SUBJECT
          $manifest = Get-Content -Raw "out-desktop-signed\desktop-build-manifest.json" | ConvertFrom-Json
          if ($manifest.signatureState -cne "SIGNED" -or $manifest.signature -cne "SIGNED") { throw "SIGNED_MANIFEST_INVALID" }
          "CHATCOM_SIGNPATH_RESULT kind=SIGNED manifest=SIGNED hashes=EMITTED"

      - name: Upload signed validation artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: chatcom-desktop-1.0.0-rc.4-windows-x64-signpath-signed-validation
          path: |
            out-desktop-signed/make/squirrel.windows/x64/ChatCOM-Desktop-1.0.0-rc.4-Setup.exe
            out-desktop-signed/make/squirrel.windows/x64/*-full.nupkg
            out-desktop-signed/make/squirrel.windows/x64/RELEASES
            out-desktop-signed/SHA256SUMS.txt
            out-desktop-signed/desktop-build-manifest.json
          if-no-files-found: error
          retention-days: 14
